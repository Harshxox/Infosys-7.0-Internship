<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillFlow - Authentication</title>
    
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Link to the external JavaScript file -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="auth-container">
        <h2 id="form-title">Sign In</h2>
        <p class="auth-subtitle" id="form-subtitle">Welcome back to the Billing Platform</p>

        <!-- Google Auth Section -->
        <div id="g_id_onload"
             data-client_id="947976051057-ncvdo5vr5ov3uqm49vvbg3kk9oq16t4v.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleGoogleLogin"
             data-auto_prompt="false">
        </div>
        
        <div class="google-btn-wrapper" style="display: flex; justify-content: center; margin-bottom: 20px;">
            <div class="g_id_signin" 
                 data-type="standard" 
                 data-shape="rectangular" 
                 data-theme="outline" 
                 data-text="continue_with" 
                 data-size="large" 
                 data-logo_alignment="left">
            </div>
        </div>
        
        <div class="divider" style="text-align: center; margin-bottom: 20px; font-size: 14px; color: #888;">OR</div>

        <!-- Standard Sign In Form -->
        <form id="signin-form">
            <div class="form-group">
                <label for="signin-email">Email Address</label>
                <input type="email" id="signin-email" required placeholder="you@company.com">
            </div>
            <div class="form-group">
                <label for="signin-password">Password</label>
                <input type="password" id="signin-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <!-- Standard Sign Up Form (Hidden by default) -->
        <form id="signup-form" class="hidden">
            <!-- Note: Full Name removed to match backend Pydantic schema -->
            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" required placeholder="you@company.com">
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" required placeholder="Create a password">
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <!-- Toggle between Sign In and Sign Up -->
        <div class="toggle-text" id="toggle-container">
            Don't have an account? <a href="#" onclick="toggleForms(); return false;">Sign up</a>
        </div>
    </div>

</body>
</html>
